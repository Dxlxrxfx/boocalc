<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BooCalc — calculadora kawaii con fantasmas en un cementerio encantador">
  <title>BooCalc 👻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Screen reader live region -->
<div id="sr-announce" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Ghost animation overlay (pointer-events: none) -->
<div id="ghost-overlay" aria-hidden="true"></div>

<!-- Moon -->
<div class="moon" aria-hidden="true"></div>

<div class="cemetery-world" aria-hidden="true">
  <svg viewBox="0 0 1440 1000" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#465047"/><stop offset="1" stop-color="#2c3732"/></linearGradient>
      <symbol id="cypress" viewBox="0 0 80 220"><path d="M35 210V140H45V210" fill="#242e2a"/><path d="M40 5C22 32 24 46 16 72C5 97 15 102 9 129C0 171 20 180 40 180C64 180 80 169 69 139C75 110 63 99 64 78C63 51 52 28 40 5Z" fill="#303d37"/><path d="M40 35V163" fill="none" stroke="#465148" stroke-width="3" opacity=".6"/></symbol>
      <symbol id="grave" viewBox="0 0 70 94"><path d="M9 86V35A26 26 0 0 1 61 35V86" fill="#69716b" stroke="#353f3a" stroke-width="3"/><path d="M17 72V35A18 18 0 0 1 53 35V72" fill="none" stroke="#858c80" stroke-width="1.5" opacity=".6"/><path d="M4 85H66V93H4Z" fill="#48564a"/><path d="M24 50H46M28 57H42" stroke="#424d46" stroke-linecap="round" stroke-width="3"/><path d="M11 84L17 77L23 86L28 79L36 87" fill="#758460"/></symbol>
      <symbol id="flower" viewBox="0 0 30 40"><path d="M15 38V15M15 30Q2 32 5 23Q12 22 15 30" fill="#7d8a68" stroke="#7d8a68" stroke-width="2"/><g fill="#c8b6bf"><circle cx="10" cy="10" r="5"/><circle cx="20" cy="10" r="5"/><circle cx="15" cy="5" r="5"/><circle cx="15" cy="16" r="5"/></g><circle cx="15" cy="11" r="4" fill="#d8d1a5"/></symbol>
    </defs>
    <g fill="#d7dbc8" opacity=".55"><circle cx="210" cy="205" r="2"/><circle cx="370" cy="130" r="2"/><circle cx="1050" cy="185" r="2"/><circle cx="1260" cy="330" r="2"/><path d="M335 320v12m-6-6h12M1120 125v12m-6-6h12M140 440v12m-6-6h12" stroke="#d7dbc8" stroke-width="1.5"/></g>
    <path d="M0 810Q190 630 420 775Q700 670 930 760Q1170 620 1440 760V1000H0Z" fill="#35413b"/>
    <g opacity=".8"><use href="#cypress" x="92" y="542" width="80" height="220"/><use href="#cypress" x="130" y="590" width="64" height="176"/><use href="#cypress" x="1234" y="548" width="80" height="220"/><use href="#cypress" x="1283" y="606" width="55" height="151"/></g>
    <path d="M0 880Q250 713 470 835Q790 715 1020 825Q1240 720 1440 810V1000H0Z" fill="url(#hill)"/>
    <g opacity=".75"><use href="#grave" x="246" y="742" width="65" height="87" transform="rotate(-9 280 790)"/><use href="#grave" x="345" y="800" width="46" height="62"/><use href="#grave" x="1105" y="744" width="62" height="83" transform="rotate(8 1135 785)"/><use href="#grave" x="1020" y="820" width="45" height="60"/></g>
    <path d="M0 971Q270 860 500 947Q770 858 1020 948Q1240 879 1440 924V1000H0Z" fill="#26342d"/>
    <g opacity=".85"><use href="#flower" x="198" y="867" width="23" height="32"/><use href="#flower" x="225" y="883" width="16" height="23"/><use href="#flower" x="1195" y="859" width="23" height="32"/></g>
  </svg>
</div>

<header class="app-header">
  <span class="brand-ghost" aria-hidden="true"><svg viewBox="0 0 50 60"><path d="M8 48V26C8 3 42 3 42 26V49L35 44L28 50L21 45L14 51Z" fill="#eeeade" stroke="#aaaeb1" stroke-width="1.5"/><ellipse cx="19" cy="27" rx="2.5" ry="3.5" fill="#3d4647"/><ellipse cx="32" cy="27" rx="2.5" ry="3.5" fill="#3d4647"/><path d="M22 34Q25 38 29 34" fill="none" stroke="#3d4647" stroke-linecap="round" stroke-width="2"/><ellipse cx="13" cy="33" rx="4" ry="2.5" fill="#d3a8af"/><ellipse cx="37" cy="33" rx="4" ry="2.5" fill="#d3a8af"/></svg></span>
  <h1>Boo<span>Calc</span></h1>
  <p data-i18n="brandLine">Un fantasma detrás de cada número.</p>
</header>

<!-- Mist -->
<div class="mist-layer" aria-hidden="true">
  <div class="mist-band"></div>
  <div class="mist-band"></div>
  <div class="mist-band"></div>
</div>

<!-- Cemetery stage -->
<div class="stage">

  <!-- Left decorative scene -->
  <div class="scene-deco scene-deco--left" aria-hidden="true">
    <div class="bg-stones">
      <!-- Small tombstone 1 -->
      <svg class="bg-stone" viewBox="0 0 36 54" width="36" height="54">
        <rect x="4" y="18" width="28" height="30" rx="2" fill="#4a4858"/>
        <ellipse cx="18" cy="18" rx="14" ry="14" fill="#4a4858"/>
        <rect x="2" y="46" width="32" height="6" rx="2" fill="#3a3848"/>
        <text x="18" y="30" text-anchor="middle" font-size="10" fill="#6a6878" font-family="serif">R.I.P</text>
        <rect x="6" y="44" width="24" height="3" rx="1" fill="#3a5030" opacity=".7"/>
      </svg>
      <!-- Small tombstone 2 -->
      <svg class="bg-stone" viewBox="0 0 44 60" width="44" height="60">
        <rect x="6" y="20" width="32" height="34" rx="2" fill="#52505e"/>
        <ellipse cx="22" cy="20" rx="16" ry="16" fill="#52505e"/>
        <rect x="3" y="51" width="38" height="7" rx="2" fill="#3e3c4c"/>
        <line x1="22" y1="8" x2="22" y2="36" stroke="#3a3848" stroke-width="1.5" opacity=".5"/>
        <line x1="14" y1="16" x2="30" y2="28" stroke="#3a3848" stroke-width="1.5" opacity=".4"/>
        <rect x="8" y="48" width="28" height="4" rx="1" fill="#3a5030" opacity=".6"/>
      </svg>
      <!-- Tiny cross marker -->
      <svg class="bg-stone" viewBox="0 0 20 36" width="20" height="36">
        <rect x="8" y="0" width="4" height="20" rx="1.5" fill="#3a3848"/>
        <rect x="2" y="6" width="16" height="4" rx="1.5" fill="#3a3848"/>
        <rect x="4" y="28" width="12" height="8" rx="1" fill="#2e2c3c"/>
        <rect x="4" y="34" width="12" height="3" rx="1" fill="#3a5030" opacity=".6"/>
      </svg>
    </div>
  </div>

  <!-- Calculator -->
  <main class="calculator" role="main" aria-label="BooCalc">

    <!-- Display -->
    <section id="display-panel" aria-label="Pantalla de la calculadora" data-caption="Entre números y apariciones">
      <div id="display-expr" aria-hidden="true"></div>
      <div id="display-value" role="text" aria-label="Resultado actual">0</div>
    </section>

    <!-- Keypad -->
    <div id="keypad" role="group" aria-label="Teclado numérico"></div>

    <!-- Controls -->
    <div id="controls" role="group" aria-label="Controles"></div>

  </main>

  <!-- Right decorative scene -->
  <div class="scene-deco scene-deco--right" aria-hidden="true">
    <div class="bg-stones">
      <!-- Obelisk -->
      <svg class="bg-stone" viewBox="0 0 24 70" width="24" height="70">
        <polygon points="12,2 7,20 17,20" fill="#4a4858"/>
        <rect x="6" y="18" width="12" height="40" fill="#4a4858"/>
        <rect x="4" y="56" width="16" height="8" rx="1" fill="#3a3848"/>
        <rect x="4" y="61" width="16" height="3" rx="1" fill="#3a5030" opacity=".6"/>
      </svg>
      <!-- Round top stone -->
      <svg class="bg-stone" viewBox="0 0 50 65" width="50" height="65">
        <rect x="8" y="22" width="34" height="37" rx="2" fill="#52505e"/>
        <ellipse cx="25" cy="22" rx="17" ry="17" fill="#52505e"/>
        <rect x="4" y="55" width="42" height="8" rx="2" fill="#3e3c4c"/>
        <text x="25" y="36" text-anchor="middle" font-size="9" fill="#7070a0" opacity=".7" font-family="serif">✦</text>
        <text x="25" y="48" text-anchor="middle" font-size="8" fill="#7070a0" opacity=".5" font-family="serif">∞</text>
        <rect x="6" y="58" width="38" height="4" rx="1" fill="#3a5030" opacity=".65"/>
      </svg>
      <!-- Tiny stone -->
      <svg class="bg-stone" viewBox="0 0 30 44" width="30" height="44">
        <rect x="4" y="14" width="22" height="24" rx="2" fill="#454354"/>
        <ellipse cx="15" cy="14" rx="11" ry="11" fill="#454354"/>
        <rect x="2" y="34" width="26" height="6" rx="2" fill="#353344"/>
        <rect x="4" y="37" width="22" height="3" rx="1" fill="#3a5030" opacity=".6"/>
      </svg>
    </div>
  </div>

</div><!-- .stage -->

<script type="module">
  import { init } from './ui.js';
  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
